---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="meta">{{ page.date | date: "%-d %B %Y" }}{% if page.categories.size > 0 %} · {{ page.categories | join: ", " }}{% endif %}</p>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/' | relative_url }}">← All posts</a></p>
</article>
<script>
// Turn each image's alt text into a caption, and lay out runs of images as a grid.
document.querySelectorAll('.post-content p').forEach(function (p) {
  var imgs = p.querySelectorAll(':scope > img');
  if (!imgs.length || p.textContent.trim() !== '') return;
  if (imgs.length > 1) p.classList.add('gallery');
  imgs.forEach(function (img) {
    var fig = document.createElement('figure');
    if (/panorama|route-map/.test(img.src)) fig.classList.add('wide');
    img.loading = 'lazy';
    img.parentNode.insertBefore(fig, img);
    fig.appendChild(img);
    if (img.alt) {
      var cap = document.createElement('figcaption');
      cap.textContent = img.alt;
      fig.appendChild(cap);
    }
  });
});
</script>
